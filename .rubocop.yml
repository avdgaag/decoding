---
plugins:
  - rubocop-rspec
  - rubocop-performance
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 140

Metrics/ModuleLength:
  Exclude:
    - spec/**/*_spec.rb

Metrics/AbcSize:
  Max: 18
  Exclude:
    # The benchmarks build test data in long methods.
    - benchmark/support/*.rb

Metrics/BlockLength:
  Exclude:
    - spec/**/*_spec.rb
    # The RSpec matcher DSL puts a matcher's whole definition inside one block.
    - lib/decoding/rspec/*.rb

Metrics/MethodLength:
  Max: 17
  Exclude:
    # The benchmarks build test data in long methods.
    - benchmark/support/*.rb

Style/SignalException:
  Enabled: false

Style/NumberedParametersLimit:
  Enabled: false

Style/CaseEquality:
  Enabled: false

RSpec/DescribedClass:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/IdenticalEqualityAssertion:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

# The matcher specs deliberately pass literal values to `expect` to assert on
# the messages the matchers themselves produce.
RSpec/DescribeClass:
  Exclude:
    - spec/matchers/*_spec.rb

RSpec/ExpectActual:
  Exclude:
    - spec/matchers/*_spec.rb

# The benchmarks print aligned tables, where plain format strings next to each
# other read better than annotated ones.
Style/FormatStringToken:
  Exclude:
    - benchmark/**/*.rb

Style/RedundantFormat:
  Exclude:
    - benchmark/**/*.rb
